---
- name: Обновляем кэш пакеты
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Дожидаемся освобождения dpkg lock
  shell: |
    timeout 300 sh -c '
      while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
            fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
        sleep 5
      done
    '
  args:
    executable: /bin/bash
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Устанавливаем базовые пакеты
  apt:
    name:
      - curl
      - wget
      - vim
      - git
      - python3
      - python3-pip
    state: present

- name: Отключаем swap
  shell: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Убеждаемся, что swap отключён навсегда
  lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#].*swap'
    state: absent