---
- name: Импортируем ключ репозитория PostgreSQL
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Добавляем репозиторий PostgreSQL
  apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present

- name: Устанавливаем PostgreSQL 15
  apt:
    name:
      - postgresql-15
      - postgresql-client-15
      - postgresql-contrib-15
    state: present

- name: Остановливаем и отключаем стандартный сервис PostgreSQL
  systemd:
    name: postgresql
    state: stopped
    enabled: no
    masked: yes

- name: Убеждаемся, что каталог данных PostgreSQL пуст
  file:
    path: /var/lib/postgresql/15/main
    state: absent

- name: Создаем каталог данных PostgreSQL
  file:
    path: /var/lib/postgresql/15/main
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Разрешаем подключения по паролю
  lineinfile:
    path: /etc/postgresql/15/main/pg_hba.conf
    line: "host all all 0.0.0.0/0 md5"
    insertafter: EOF

- name: Разрешаем внешние подключения
  lineinfile:
    path: /etc/postgresql/15/main/postgresql.conf
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '*'"
